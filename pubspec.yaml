name: carboneto
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  provider: ^6.1.2
  flutter:
    sdk: flutter
  
  # Utility Packages
  file_picker: ^10.3.3
  http: ^1.3.0
  intl: any
  logger: ^2.5.0
  url_launcher: ^6.3.1  
  animated_splash_screen: ^1.3.0
  flutter_native_splash: ^2.4.6
  smooth_page_indicator: ^1.2.0+3
  connectivity_plus: ^6.1.3
  lottie: ^3.2.0
  country_flags: ^3.3.0
  shimmer: ^3.0.0
  country_code_picker: ^3.4.0
  country_picker: ^2.0.27
  cached_network_image: ^3.4.1
  world_info_plus: ^1.0.1
  uuid: ^4.5.2
  
  # Videos
  chewie: ^1.12.1
  video_player: ^2.10.0
  flutter_cache_manager: ^3.4.1

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  capped_progress_indicator: ^0.0.2
  percent_indicator: ^4.2.5

  # Firebase
  firebase_storage: ^12.4.5
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.7
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/logos/social_logos/
    - assets/images/signup/
    - assets/images/home_menu/
    - assets/images/training/
    - assets/images/onboarding/
    - assets/images/profile/
    - assets/images/create/
    - assets/animations/loading/
    - assets/animations/email_verification/
    - assets/animations/reset_password/
    - assets/images/explore/finalizacao/    
    - assets/images/explore/arremesso/
    - assets/videos/



  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaText-Light.otf
          weight: 300
        - asset: assets/fonts/PlusJakartaText-Regular.otf
          weight: 400
        - asset: assets/fonts/PlusJakartaText-Italic.otf
          style: italic
        - asset: assets/fonts/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/PlusJakartaDisplay-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/PlusJakartaDisplay-BoldItalic.otf
          weight: 600
        - asset: assets/fonts/PlusJakartaText-Bold.otf
          weight: 800
